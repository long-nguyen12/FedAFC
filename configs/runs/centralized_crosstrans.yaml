kind: centralized
use_table_evidence: true
seed: 42
device: cpu
output_root: outputs
feature_cache_dir: null     # thư mục cache feature frozen; null = không cache

datasets:
  - id: mocheg
    path: datasets/mocheg
  - id: mmcv
    path: datasets/mmcv
    subset: all
    mmqa_path: datasets/mmqa
    split:
      ratios: [0.8, 0.1, 0.1]
      seed: 42

encoders:
  text:
    checkpoint_path: roberta-base
    revision: null
    max_length: 128
  evidence:
    checkpoint_path: allenai/longformer-base-4096
    revision: null
    max_length: null          # không cắt; claim dài quá 4.096 token được tách theo ranh giới đoạn
  vision:
    checkpoint_path: openai/clip-vit-base-patch32
    revision: null

model:
  hidden_dim: 256
  num_heads: 8
  dropout: 0.1
  cls_dropout: 0.4

max_text_evidence: null     # null = dùng mọi đoạn text evidence
max_image_evidence: null    # null = dùng mọi ảnh evidence
max_table_evidence: 2
max_table_tokens: 1024

training:
  batch_size: 2
  epochs: 5
  learning_rate: 0.0001     # S4: giữ 1e-4, bằng AdamW lr của repo MCVE
  mode: shared_private
  private_weight: 0.5
  logit_adjustment: 1.0     # A6: tau; 0.0 disables
  patience: 3
  reshuffle_records: true   # A9: xáo record và chia batch lại mỗi epoch/round

evaluation:
  primary_cohort: all_eligible
  train_metrics: true       # B1b: chấm checkpoint đã chọn trên train (metrics_train.json)
